[project]
name = "pc1251ish-demo"
version = "0.1.0"
description = "SHARP PC-1251の画面シミュレータと、その上で動くデモ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "origuchi", email = "hisaorig@gmail.com" }]
dependencies = [
    "pygame>=2.5",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
